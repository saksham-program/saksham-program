<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">How Saksham works — Idea to Ship</title>
<desc id="desc">An animated engineering loop showing Idea, Prototype, Test, Break, Fix and Ship, with iteration back to the next idea.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset=".58" stop-color="#09111d"/><stop offset="1" stop-color="#170d1d"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2e8cff"/><stop offset=".55" stop-color="#5578ff"/><stop offset="1" stop-color="#ff3d68"/></linearGradient>
  <linearGradient id="flow" x1="0" x2="1"><stop stop-color="#3d91ff"/><stop offset=".52" stop-color="#6878ff"/><stop offset="1" stop-color="#ff4c70"/></linearGradient>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#5e8dff" opacity=".20"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
  <path id="route" d="M145 350 H1055" fill="none"/>
</defs>

<rect x="1.5" y="1.5" width="1197" height="687" rx="34" fill="url(#bg)" stroke="url(#edge)" stroke-width="3"/>
<rect x="2" y="2" width="1196" height="686" rx="34" fill="url(#dots)"/>
<circle cx="112" cy="590" r="210" fill="#ff2858" opacity=".055" filter="url(#soft)"/>
<circle cx="1090" cy="105" r="220" fill="#147cff" opacity=".055" filter="url(#soft)"/>

<g font-family="JetBrains Mono, Fira Code, Consolas, monospace">
  <text x="58" y="64" font-size="23" fill="#77a9ff">&gt; ./how-i-work --iterate<span fill="#6e8fff">_</span></text>
  <text x="1142" y="64" text-anchor="end" font-size="14" fill="#6f809b">04 / PROCESS</text>
</g>
<line x1="58" y1="88" x2="1142" y2="88" stroke="#24344e" stroke-width="2"/>

<text x="58" y="150" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="800" fill="#f4f7ff">// HOW I WORK</text>
<text x="58" y="188" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#aebbd0">Build fast. Test hard. Break the happy path. Fix what fails. Ship. Then iterate.</text>

<!-- flow rail -->
<line x1="145" y1="350" x2="1055" y2="350" stroke="#1c304c" stroke-width="8" stroke-linecap="round"/>
<line x1="145" y1="350" x2="1055" y2="350" stroke="url(#flow)" stroke-width="3" stroke-linecap="round" stroke-dasharray="16 12" opacity=".8"/>

<!-- animated scanner -->
<circle r="9" fill="#f7fbff" filter="url(#glow)">
  <animateMotion dur="5s" repeatCount="indefinite" rotate="auto"><mpath href="#route"/></animateMotion>
</circle>
<circle r="18" fill="#438fff" opacity=".16" filter="url(#glow)">
  <animateMotion dur="5s" repeatCount="indefinite" rotate="auto"><mpath href="#route"/></animateMotion>
</circle>

<!-- nodes -->
<g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
  <g>
    <circle cx="145" cy="350" r="38" fill="#081827" stroke="#3d91ff" stroke-width="3"/>
    <circle cx="145" cy="350" r="31" fill="#0c2037"/>
    <circle cx="145" cy="350" r="31" fill="none" stroke="#3d91ff" stroke-width="2" opacity=".3">
      <animate attributeName="r" values="31;39;31" dur="5s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".35;0;.35" dur="5s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <text x="145" y="357" font-size="19" font-weight="800" fill="#fff">01</text>
    <text x="145" y="419" font-size="22" font-weight="800" fill="#fff">IDEA</text>
    <text x="145" y="444" font-size="15" fill="#8395ae">spot a problem</text>
  </g>

  <g>
    <circle cx="327" cy="350" r="38" fill="#081827" stroke="#438fff" stroke-width="3"/>
    <circle cx="327" cy="350" r="31" fill="#10223b"/>
    <circle cx="327" cy="350" r="31" fill="none" stroke="#438fff" stroke-width="2" opacity=".3">
      <animate attributeName="r" values="31;39;31" dur="5s" begin=".83s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".35;0;.35" dur="5s" begin=".83s" repeatCount="indefinite"/>
    </circle>
    <text x="327" y="357" font-size="19" font-weight="800" fill="#fff">02</text>
    <text x="327" y="419" font-size="22" font-weight="800" fill="#fff">PROTOTYPE</text>
    <text x="327" y="444" font-size="15" fill="#8395ae">make it real</text>
  </g>

  <g>
    <circle cx="509" cy="350" r="38" fill="#0a1728" stroke="#5d82ff" stroke-width="3"/>
    <circle cx="509" cy="350" r="31" fill="#171f45"/>
    <circle cx="509" cy="350" r="31" fill="none" stroke="#7182ff" stroke-width="2" opacity=".3">
      <animate attributeName="r" values="31;39;31" dur="5s" begin="1.66s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".35;0;.35" dur="5s" begin="1.66s" repeatCount="indefinite"/>
    </circle>
    <text x="509" y="357" font-size="19" font-weight="800" fill="#fff">03</text>
    <text x="509" y="419" font-size="22" font-weight="800" fill="#fff">TEST</text>
    <text x="509" y="444" font-size="15" fill="#8395ae">measure reality</text>
  </g>

  <g>
    <circle cx="691" cy="350" r="38" fill="#151321" stroke="#a45caa" stroke-width="3"/>
    <circle cx="691" cy="350" r="31" fill="#2a1930"/>
    <circle cx="691" cy="350" r="31" fill="none" stroke="#c56ba1" stroke-width="2" opacity=".3">
      <animate attributeName="r" values="31;39;31" dur="5s" begin="2.49s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".35;0;.35" dur="5s" begin="2.49s" repeatCount="indefinite"/>
    </circle>
    <text x="691" y="357" font-size="19" font-weight="800" fill="#fff">04</text>
    <text x="691" y="419" font-size="22" font-weight="800" fill="#fff">BREAK</text>
    <text x="691" y="444" font-size="15" fill="#a892ad">find the failure</text>
  </g>

  <g>
    <circle cx="873" cy="350" r="38" fill="#17121f" stroke="#df5f91" stroke-width="3"/>
    <circle cx="873" cy="350" r="31" fill="#321a2b"/>
    <circle cx="873" cy="350" r="31" fill="none" stroke="#ef6d94" stroke-width="2" opacity=".3">
      <animate attributeName="r" values="31;39;31" dur="5s" begin="3.32s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".35;0;.35" dur="5s" begin="3.32s" repeatCount="indefinite"/>
    </circle>
    <text x="873" y="357" font-size="19" font-weight="800" fill="#fff">05</text>
    <text x="873" y="419" font-size="22" font-weight="800" fill="#fff">FIX</text>
    <text x="873" y="444" font-size="15" fill="#a892ad">remove the weakness</text>
  </g>

  <g>
    <circle cx="1055" cy="350" r="38" fill="#17131f" stroke="#ff4d70" stroke-width="3"/>
    <circle cx="1055" cy="350" r="31" fill="#391827"/>
    <circle cx="1055" cy="350" r="31" fill="none" stroke="#ff708d" stroke-width="2" opacity=".3">
      <animate attributeName="r" values="31;39;31" dur="5s" begin="4.15s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".35;0;.35" dur="5s" begin="4.15s" repeatCount="indefinite"/>
    </circle>
    <text x="1055" y="357" font-size="19" font-weight="800" fill="#fff">06</text>
    <text x="1055" y="419" font-size="22" font-weight="800" fill="#fff">SHIP</text>
    <text x="1055" y="444" font-size="15" fill="#c39aaa">put it in users' hands</text>
  </g>
</g>

<!-- iteration loop -->
<path d="M1055 510 C1055 575 975 600 875 600 H325 C225 600 145 575 145 510" fill="none" stroke="#263b5a" stroke-width="3" stroke-dasharray="8 10"/>
<path d="M145 510 C145 575 225 600 325 600 H875 C975 600 1055 575 1055 510" fill="none" stroke="url(#flow)" stroke-width="2" stroke-dasharray="10 14">
  <animate attributeName="stroke-dashoffset" from="0" to="-96" dur="2s" repeatCount="indefinite"/>
</path>
<text x="600" y="585" text-anchor="middle" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="15" font-weight="700" fill="#7387a3">FEEDBACK → ITERATE → NEXT VERSION</text>

<rect x="58" y="632" width="1084" height="2" fill="url(#flow)"/>
<text x="58" y="660" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="14" fill="#6f809b">SYSTEM: ITERATIVE</text>
<text x="1142" y="660" text-anchor="end" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="14" fill="#6f809b">STATUS: SHIPPING</text>
</svg>