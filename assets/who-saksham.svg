<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Who is Saksham?</title><desc id="desc">A profile card introducing Saksham Jagetiya, a B.Tech Computer Science and Engineering student specializing in AI and Analytics.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset=".58" stop-color="#09111d"/><stop offset="1" stop-color="#170d1d"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2e8cff"/><stop offset=".55" stop-color="#5578ff"/><stop offset="1" stop-color="#ff3d68"/></linearGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#74a9ff"/><stop offset=".48" stop-color="#398dff"/><stop offset="1" stop-color="#d84d9b"/></linearGradient>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#5e8dff" opacity=".22"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="1.5" y="1.5" width="1197" height="697" rx="34" fill="url(#bg)" stroke="url(#edge)" stroke-width="3"/>
<rect x="2" y="2" width="1196" height="696" rx="34" fill="url(#dots)"/>
<circle cx="112" cy="620" r="210" fill="#ff2858" opacity=".055" filter="url(#glow)"/>
<circle cx="1090" cy="95" r="230" fill="#147cff" opacity=".06" filter="url(#glow)"/>
<g font-family="JetBrains Mono, Fira Code, Consolas, monospace">
  <text x="58" y="64" font-size="23" fill="#77a9ff">&gt; whoami<span fill="#6e8fff">_</span></text>
  <circle cx="1132" cy="54" r="6" fill="#ff3b61"/><circle cx="1154" cy="54" r="6" fill="#4b8fff"/><circle cx="1176" cy="54" r="6" fill="#707bff"/>
</g>
<line x1="58" y1="88" x2="1142" y2="88" stroke="#24344e" stroke-width="2"/>
<text x="58" y="175" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="800" fill="#f5f7ff">Saksham</text>
<text x="58" y="257" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="800" fill="url(#name)">Jagetiya</text>
<text x="61" y="303" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="22" font-weight="700" fill="#eef3ff">&gt; B.Tech CSE  ·  AI &amp; Analytics</text>
<rect x="58" y="344" width="1084" height="2" fill="#2d405e"/>
<text x="58" y="398" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#f4f7ff">I build at the point where <tspan fill="#6aa7ff">AI</tspan>, <tspan fill="#ffffff" font-weight="700">software</tspan></text>
<text x="58" y="437" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#f4f7ff">and <tspan fill="#ff5a78">real problems</tspan> meet — from models to working products.</text>
<text x="58" y="492" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#c6cfdf">I care about what happens after the demo:</text>
<text x="58" y="529" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#f2f5ff">messy data · wrong models · real users · unreliable AI</text>
<g font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="15" font-weight="700">
  <rect x="58" y="584" width="160" height="42" rx="21" fill="#0b1728" stroke="#2b80ff"/><text x="78" y="611" fill="#6fa8ff">AI / ML</text>
  <rect x="232" y="584" width="220" height="42" rx="21" fill="#0b1728" stroke="#435fbe"/><text x="252" y="611" fill="#a6b7ff">AI RELIABILITY</text>
  <rect x="466" y="584" width="246" height="42" rx="21" fill="#0b1728" stroke="#b04f9b"/><text x="486" y="611" fill="#e99bc9">PRODUCT ENGINEERING</text>
  <rect x="726" y="584" width="220" height="42" rx="21" fill="#0b1728" stroke="#ff4e6e"/><text x="746" y="611" fill="#ff92a5">DATA &amp; ANALYTICS</text>
</g>
<text x="1068" y="612" text-anchor="end" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="14" fill="#6f809b">01 / IDENTITY</text>
</svg>