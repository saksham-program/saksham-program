<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">What I build</title><desc id="desc">Saksham builds AI systems, reliable AI workflows, full-stack products and data-driven tools.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset=".58" stop-color="#09111d"/><stop offset="1" stop-color="#170d1d"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2e8cff"/><stop offset=".55" stop-color="#5578ff"/><stop offset="1" stop-color="#ff3d68"/></linearGradient>
  <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#438fff"/><stop offset=".62" stop-color="#6679ff"/><stop offset="1" stop-color="#ff4f73"/></linearGradient>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#5e8dff" opacity=".20"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="1.5" y="1.5" width="1197" height="647" rx="34" fill="url(#bg)" stroke="url(#edge)" stroke-width="3"/>
<rect x="2" y="2" width="1196" height="646" rx="34" fill="url(#dots)"/>
<circle cx="1100" cy="95" r="220" fill="#147cff" opacity=".055" filter="url(#glow)"/>
<circle cx="100" cy="575" r="190" fill="#ff2858" opacity=".045" filter="url(#glow)"/>

<g font-family="JetBrains Mono, Fira Code, Consolas, monospace">
  <text x="58" y="64" font-size="23" fill="#77a9ff">&gt; ./what-i-build --systems<span fill="#6e8fff">_</span></text>
  <text x="1142" y="64" text-anchor="end" font-size="14" fill="#6f809b">01 / BUILD</text>
</g>
<line x1="58" y1="88" x2="1142" y2="88" stroke="#24344e" stroke-width="2"/>

<text x="58" y="153" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="800" fill="#f5f7ff">WHAT I BUILD</text>
<text x="58" y="193" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#aebbd0">AI systems, useful products and the engineering that makes them survive beyond the demo.</text>

<g font-family="Arial, Helvetica, sans-serif">
  <rect x="58" y="230" width="525" height="145" rx="22" fill="#081522" stroke="#245f9f" stroke-width="2"/>
  <rect x="58" y="230" width="7" height="145" rx="3" fill="#3d91ff"/>
  <text x="92" y="270" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="16" font-weight="800" fill="#6da9ff">01  AI / ML SYSTEMS</text>
  <text x="92" y="307" font-size="23" font-weight="800" fill="#ffffff">Models that solve real problems.</text>
  <text x="92" y="340" font-size="18" fill="#b9c6d8">NLP · prediction · multimodal AI · evaluation</text>
  <text x="92" y="365" font-size="18" fill="#7f93ad">From experiments to usable workflows.</text>

  <rect x="617" y="230" width="525" height="145" rx="22" fill="#0b1423" stroke="#485fba" stroke-width="2"/>
  <rect x="617" y="230" width="7" height="145" rx="3" fill="#687bff"/>
  <text x="651" y="270" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="16" font-weight="800" fill="#9ba9ff">02  AI RELIABILITY</text>
  <text x="651" y="307" font-size="23" font-weight="800" fill="#ffffff">Find where AI gets it wrong.</text>
  <text x="651" y="340" font-size="18" fill="#b9c6d8">Hallucinations · consistency · failure modes</text>
  <text x="651" y="365" font-size="18" fill="#7f93ad">Trust is part of the product.</text>

  <rect x="58" y="395" width="525" height="145" rx="22" fill="#0b1423" stroke="#7359ae" stroke-width="2"/>
  <rect x="58" y="395" width="7" height="145" rx="3" fill="#a15ca9"/>
  <text x="92" y="435" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="16" font-weight="800" fill="#d293c8">03  PRODUCT ENGINEERING</text>
  <text x="92" y="472" font-size="23" font-weight="800" fill="#ffffff">Turn ideas into working products.</text>
  <text x="92" y="505" font-size="18" fill="#b9c6d8">APIs · databases · full-stack apps · workflows</text>
  <text x="92" y="530" font-size="18" fill="#7f93ad">Build it. Test it. Put it in users' hands.</text>

  <rect x="617" y="395" width="525" height="145" rx="22" fill="#160f1c" stroke="#a74b8d" stroke-width="2"/>
  <rect x="617" y="395" width="7" height="145" rx="3" fill="#ff587b"/>
  <text x="651" y="435" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="16" font-weight="800" fill="#ff8ea4">04  DATA &amp; ANALYTICS</text>
  <text x="651" y="472" font-size="23" font-weight="800" fill="#ffffff">Turn raw data into decisions.</text>
  <text x="651" y="505" font-size="18" fill="#b9c6d8">Analytics · feature engineering · ML pipelines</text>
  <text x="651" y="530" font-size="18" fill="#7f93ad">Useful signals, not just pretty charts.</text>
</g>

<rect x="58" y="575" width="1084" height="3" rx="2" fill="url(#accent)"/>
<g font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="14">
  <text x="58" y="608" fill="#6f809b">FOCUS: AI × SOFTWARE × REAL PROBLEMS</text>
  <text x="1142" y="608" text-anchor="end" fill="#6f809b">BUILD → TEST → LEARN</text>
</g>
</svg>